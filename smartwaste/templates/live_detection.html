{% extends 'base.html' %}

{% block title %}Live Waste Detection{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-4">

        <h2 class="fw-bold">
            ♻️ Live Waste Detection
        </h2>

        <p class="text-muted">
            Use your camera to detect waste using YOLO and OpenCV
        </p>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <!-- Camera -->
                    <div class="position-relative text-center">

                        <video
                            id="camera"
                            autoplay
                            playsinline
                            class="w-100 rounded"
                            style="background:#111; max-height:500px;"
                        ></video>

                        <canvas
                            id="overlay"
                            class="position-absolute top-0 start-0 w-100 h-100"
                        ></canvas>

                    </div>


                    <!-- Status -->
                    <div
                        id="status"
                        class="alert alert-info mt-3 text-center"
                    >
                        Camera is not started.
                    </div>


                    <!-- Buttons -->
                    <div class="text-center mt-3">

                        <button
                            id="startButton"
                            class="btn btn-success me-2"
                        >
                            📷 Start Camera
                        </button>


                        <button
                            id="stopButton"
                            class="btn btn-danger me-2"
                            disabled
                        >
                            ⏹ Stop Camera
                        </button>


                        <button
                            id="captureButton"
                            class="btn btn-primary"
                            disabled
                        >
                            📸 Capture Detection
                        </button>

                    </div>


                    <!-- Capture Status -->
                    <div
                        id="captureStatus"
                        class="mt-3 text-center"
                    ></div>


                    <!-- Detection Result -->
                    <div class="mt-4">

                        <h5 class="fw-bold">
                            🔍 Detected Waste
                        </h5>

                        <div id="detections">

                            <p class="text-muted">
                                No detection yet.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const captureButton =
    document.getElementById("captureButton");

const statusBox =
    document.getElementById("status");

const detectionsBox =
    document.getElementById("detections");

const captureStatus =
    document.getElementById("captureStatus");


let stream = null;

let detectionRunning = false;

let latestDetections = [];


/* =====================================================
   BUTTON EVENTS
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);

stopButton.addEventListener(
    "click",
    stopCamera
);

captureButton.addEventListener(
    "click",
    captureDetection
);


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: 640,
                    height: 480
                },

                audio: false

            });


        video.srcObject = stream;

        detectionRunning = true;


        startButton.disabled = true;

        stopButton.disabled = false;

        captureButton.disabled = false;


        statusBox.className =
            "alert alert-success mt-3 text-center";


        statusBox.innerText =
            "Camera started. Detecting waste...";


        detectFrame();


    } catch (error) {

        console.error(
            "Camera Error:",
            error
        );


        statusBox.className =
            "alert alert-danger mt-3 text-center";


        statusBox.innerText =
            "Unable to access camera.";

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    detectionRunning = false;


    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;

    }


    video.srcObject = null;


    startButton.disabled = false;

    stopButton.disabled = true;

    captureButton.disabled = true;


    statusBox.className =
        "alert alert-secondary mt-3 text-center";


    statusBox.innerText =
        "Camera stopped.";


    clearCanvas();

}


/* =====================================================
   LIVE YOLO DETECTION
===================================================== */

async function detectFrame() {

    if (!detectionRunning) {
        return;
    }


    if (video.readyState < 2) {

        setTimeout(
            detectFrame,
            500
        );

        return;

    }


    const tempCanvas =
        document.createElement("canvas");


    tempCanvas.width =
        video.videoWidth;

    tempCanvas.height =
        video.videoHeight;


    const context =
        tempCanvas.getContext("2d");


    context.drawImage(
        video,
        0,
        0,
        tempCanvas.width,
        tempCanvas.height
    );


    tempCanvas.toBlob(

        async (blob) => {

            if (!blob) {

                setTimeout(
                    detectFrame,
                    500
                );

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "frame",
                blob,
                "frame.jpg"
            );


            try {

                const response =
                    await fetch(

                        "{% url 'live_detection_api' %}",

                        {
                            method: "POST",

                            headers: {
                                "X-CSRFToken":
                                    getCookie("csrftoken")
                            },

                            body: formData

                        }

                    );


                const data =
                    await response.json();


                if (data.success) {

                    latestDetections =
                        data.detections;


                    drawDetections(
                        data.detections
                    );

                }


            } catch (error) {

                console.error(
                    "Detection error:",
                    error
                );

            }


            setTimeout(
                detectFrame,
                500
            );

        },

        "image/jpeg",

        0.7

    );

}


/* =====================================================
   DRAW DETECTIONS
===================================================== */

function drawDetections(detections) {

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (detections.length === 0) {

        detectionsBox.innerHTML =
            '<p class="text-muted">No waste detected.</p>';

        return;

    }


    let html = "";


    detections.forEach(
        detection => {

            const x =
                detection.x1;

            const y =
                detection.y1;

            const width =
                detection.x2 -
                detection.x1;

            const height =
                detection.y2 -
                detection.y1;


            ctx.strokeStyle =
                "#00ff00";

            ctx.lineWidth = 3;


            ctx.strokeRect(
                x,
                y,
                width,
                height
            );


            ctx.fillStyle =
                "#00ff00";

            ctx.font =
                "18px Arial";


            ctx.fillText(

                `${detection.class} ${detection.confidence}%`,

                x,

                Math.max(
                    20,
                    y - 5
                )

            );


            html += `

                <div class="alert alert-success py-2">

                    <strong>
                        ${detection.class}
                    </strong>

                    -

                    ${detection.confidence}%
                    confidence

                </div>

            `;

        }
    );


    detectionsBox.innerHTML =
        html;

}


/* =====================================================
   CAPTURE AND SAVE DETECTION
===================================================== */

async function captureDetection() {

    console.log(
        "Capture button clicked"
    );


    /* Check camera */

    if (!stream) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    /* Check detection */

    if (
        !latestDetections ||
        latestDetections.length === 0
    ) {

        alert(
            "No waste detected. Please show a waste object to the camera."
        );

        return;

    }


    /* Get first detected object */

    const detection =
        latestDetections[0];


    console.log(
        "Detected object:",
        detection
    );


    captureStatus.innerHTML = `

        <div class="alert alert-info">

            ⏳ Saving detection...

        </div>

    `;


    /* Create capture canvas */

    const captureCanvas =
        document.createElement("canvas");


    captureCanvas.width =
        video.videoWidth;

    captureCanvas.height =
        video.videoHeight;


    const captureContext =
        captureCanvas.getContext("2d");


    captureContext.drawImage(

        video,

        0,
        0,

        captureCanvas.width,
        captureCanvas.height

    );


    /* Convert image */

    captureCanvas.toBlob(

        async function(blob) {

            if (!blob) {

                captureStatus.innerHTML = `

                    <div class="alert alert-danger">

                        ❌ Unable to capture image.

                    </div>

                `;

                return;

            }


            console.log(
                "Image captured successfully"
            );


            /* Create form */

            const formData =
                new FormData();


            formData.append(
                "captured_image",
                blob,
                "live_detection.jpg"
            );


            formData.append(
                "category",
                detection.class
            );


            formData.append(
                "confidence",
                detection.confidence
            );


            console.log(
                "Sending image to Django..."
            );


            try {

                /* Send to Django */

                const response =
                    await fetch(

                        "{% url 'capture_detection' %}",

                        {

                            method: "POST",

                            headers: {

                                "X-CSRFToken":
                                    getCookie("csrftoken")

                            },

                            body: formData

                        }

                    );


                console.log(
                    "Server response status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "Server response:",
                    data
                );


                /* Successful */

                if (data.success) {

                    captureStatus.innerHTML = `

                        <div class="alert alert-success">

                            <strong>
                                ✅ Detection Saved Successfully!
                            </strong>

                            <br><br>

                            Category:
                            <strong>
                                ${data.category}
                            </strong>

                            <br>

                            Confidence:
                            <strong>
                                ${data.confidence}%
                            </strong>

                            <br><br>

                            <a
                                href="{% url 'detection_history' %}"
                                class="btn btn-dark btn-sm"
                            >
                                📋 View History
                            </a>

                        </div>

                    `;

                }


                /* Server error */

                else {

                    captureStatus.innerHTML = `

                        <div class="alert alert-danger">

                            ❌
                            ${data.error}

                        </div>

                    `;

                }


            }

            catch (error) {

                console.error(
                    "Save detection error:",
                    error
                );


                captureStatus.innerHTML = `

                    <div class="alert alert-danger">

                        ❌ Unable to connect to server.

                        <br>

                        Check the terminal for errors.

                    </div>

                `;

            }

        },

        "image/jpeg",

        0.9

    );

}


/* =====================================================
   CLEAR
===================================================== */

function clearCanvas() {

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    latestDetections = [];


    detectionsBox.innerHTML =
        '<p class="text-muted">No detection yet.</p>';


    captureStatus.innerHTML = "";

}


/* =====================================================
   GET CSRF COOKIE
===================================================== */

function getCookie(name) {

    let cookieValue = null;


    if (document.cookie) {

        const cookies =
            document.cookie.split(";");


        for (
            let cookie of cookies
        ) {

            cookie =
                cookie.trim();


            if (

                cookie.substring(
                    0,
                    name.length + 1
                ) === name + "="

            ) {

                cookieValue =
                    decodeURIComponent(

                        cookie.substring(
                            name.length + 1
                        )

                    );

                break;

            }

        }

    }


    return cookieValue;

}

</script>

{% endblock %}
