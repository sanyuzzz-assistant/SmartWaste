{% extends 'base.html' %}

{% block title %}
Register - SmartWaste
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <!-- Register Header -->

                    <div class="text-center mb-4">

                        <div class="fs-1">
                            ♻️
                        </div>

                        <h2 class="fw-bold">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join SmartWaste and make waste management smarter.
                        </p>

                    </div>


                    <!-- Registration Form -->

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}


                        <button
                            type="submit"
                            class="btn btn-success w-100 py-2">

                            Create Account

                        </button>

                    </form>


                    <!-- Login Link -->

                    <div class="text-center mt-4">

                        <p class="text-muted mb-1">
                            Already have an account?
                        </p>

                        <a
                            href="{% url 'login_view' %}"
                            class="text-success fw-bold text-decoration-none">

                            Login here

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
